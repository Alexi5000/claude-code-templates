name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/security-audit.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: cli-tool
            dir: cli-tool
            blocking: true
          - unit: api
            dir: api
            blocking: true
          - unit: root
            dir: .
            blocking: true
          - unit: docs-monitor
            dir: cloudflare-workers/docs-monitor
            blocking: true
          - unit: pulse
            dir: cloudflare-workers/pulse
            blocking: true
          - unit: example-backend
            dir: cli-tool/components/skills/ai-research/loki-mode/examples/todo-app-generated/backend
            blocking: true
          - unit: example-frontend
            dir: cli-tool/components/skills/ai-research/loki-mode/examples/todo-app-generated/frontend
            blocking: true
          - unit: dashboard
            dir: dashboard
            blocking: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit ${{ matrix.unit }}
        run: npm audit --audit-level=low
        working-directory: ${{ matrix.dir }}
        continue-on-error: ${{ matrix.blocking == false }}
      # Dashboard remains report-only pending the required Pages-to-Workers migration.
