name: Dependency Security Audit

on:
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/security-audit.yml'
      - 'dashboard/**'
      - 'cli-tool/components/sandbox/cloudflare/safe-output.cjs'
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '.github/workflows/security-audit.yml'
      - 'dashboard/**'
      - 'cli-tool/components/sandbox/cloudflare/safe-output.cjs'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: cli-tool
            dir: cli-tool
            blocking: true
          - unit: api
            dir: api
            blocking: true
          - unit: root
            dir: .
            blocking: true
          - unit: docs-monitor
            dir: cloudflare-workers/docs-monitor
            blocking: true
          - unit: pulse
            dir: cloudflare-workers/pulse
            blocking: true
          - unit: example-backend
            dir: cli-tool/components/skills/ai-research/loki-mode/examples/todo-app-generated/backend
            blocking: true
          - unit: example-frontend
            dir: cli-tool/components/skills/ai-research/loki-mode/examples/todo-app-generated/frontend
            blocking: true
          - unit: analytics-ui
            dir: cli-tool/analytics-ui
            blocking: true
          - unit: dashboard
            dir: dashboard
            blocking: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit ${{ matrix.unit }}
        run: npm audit --audit-level=low
        working-directory: ${{ matrix.dir }}
        continue-on-error: ${{ matrix.blocking == false }}

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: npx wrangler deploy --dry-run
        working-directory: dashboard

  analytics-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: cli-tool/analytics-ui/package-lock.json
      - run: npm ci
        working-directory: cli-tool/analytics-ui
      - run: npm run build
        working-directory: cli-tool/analytics-ui
