name: Security Hook Regression

on:
  push:
    branches: [main]
    paths:
      - 'cli-tool/components/skills/development/artifacts-builder/scripts/init-artifact.sh'
      - 'cli-tool/components/skills/development/web-artifacts-builder/scripts/init-artifact.sh'
      - 'cli-tool/components/skills/development/jupyter-notebook/scripts/new_notebook.py'
      - 'cli-tool/components/skills/scientific/pydicom/scripts/anonymize_dicom.py'
      - 'cli-tool/components/skills/scientific/perplexity-search/scripts/setup_env.py'
      - 'cli-tool/components/skills/scientific/citation-management/scripts/extract_metadata.py'
      - 'cli-tool/components/skills/scientific/biorxiv-database/scripts/biorxiv_search.py'
      - 'cli-tool/components/skills/scientific/biomni/scripts/setup_environment.py'
      - 'cli-tool/components/skills/enterprise-communication/session-handoff/scripts/validate_handoff.py'
      - 'cli-tool/components/hooks/security/secret-scanner.py'
      - 'cli-tool/components/skills/development/devops-iac-engineer/scripts/devops_utils.py'
      - 'cli-tool/components/skills/ai-research/post-training-grpo-rl-training/examples/reward_functions_library.py'
      - 'cli-tool/tests/security/**'
      - '.github/workflows/security-hooks.yml'
  pull_request:
    paths:
      - 'cli-tool/components/skills/development/artifacts-builder/scripts/init-artifact.sh'
      - 'cli-tool/components/skills/development/web-artifacts-builder/scripts/init-artifact.sh'
      - 'cli-tool/components/skills/development/jupyter-notebook/scripts/new_notebook.py'
      - 'cli-tool/components/skills/scientific/pydicom/scripts/anonymize_dicom.py'
      - 'cli-tool/components/skills/scientific/perplexity-search/scripts/setup_env.py'
      - 'cli-tool/components/skills/scientific/citation-management/scripts/extract_metadata.py'
      - 'cli-tool/components/skills/scientific/biorxiv-database/scripts/biorxiv_search.py'
      - 'cli-tool/components/skills/scientific/biomni/scripts/setup_environment.py'
      - 'cli-tool/components/skills/enterprise-communication/session-handoff/scripts/validate_handoff.py'
      - 'cli-tool/components/hooks/security/secret-scanner.py'
      - 'cli-tool/components/skills/development/devops-iac-engineer/scripts/devops_utils.py'
      - 'cli-tool/components/skills/ai-research/post-training-grpo-rl-training/examples/reward_functions_library.py'
      - 'cli-tool/tests/security/**'
      - '.github/workflows/security-hooks.yml'

permissions:
  contents: read

jobs:
  secret-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - run: python -m pip install PyYAML==6.0.3 pydicom==3.0.2
      - run: python -m unittest discover -s cli-tool/tests/security -p 'test_*.py'
