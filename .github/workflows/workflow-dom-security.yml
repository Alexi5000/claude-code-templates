name: Workflow DOM Security

on:
  push:
    branches: [main]
    paths:
      - 'docs/js/workflows-events.js'
      - 'docs/jobs.html'
      - 'cli-tool/src/analytics-web/chats_mobile.html'
      - 'scripts/test-search-dom.py'
      - 'scripts/test-workflow-dom.py'
      - '.github/workflows/workflow-dom-security.yml'
  pull_request:
    paths:
      - 'docs/js/workflows-events.js'
      - 'docs/jobs.html'
      - 'cli-tool/src/analytics-web/chats_mobile.html'
      - 'scripts/test-search-dom.py'
      - 'scripts/test-workflow-dom.py'
      - '.github/workflows/workflow-dom-security.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-workflow-dom.py
      - run: python scripts/test-search-dom.py
