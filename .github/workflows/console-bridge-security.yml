name: Console bridge security
on:
  pull_request:
    paths:
      - 'cli-tool/src/command-stats.js'
      - 'cli-tool/src/tracking-service.js'
      - 'docs/js/event-tracker.js'
      - 'cli-tool/tests/security/tracking-identifiers.test.cjs'
      - 'cli-tool/src/file-operations.js'
      - 'cli-tool/tests/security/write-permission-probe.test.cjs'
      - 'cli-tool/tests/security/cli-prompt-arguments.test.cjs'
      - 'cli-tool/src/skill-dashboard.js'
      - 'cli-tool/tests/security/skill-file-containment.test.cjs'
      - 'cli-tool/src/console-bridge.js'
      - 'cli-tool/src/validation/validators/ReferenceValidator.js'
      - 'cli-tool/tests/security/reference-url-accounting.test.cjs'
      - 'cli-tool/src/analytics/core/StateCalculator.js'
      - 'cli-tool/tests/security/state-calculator-inputs.test.cjs'
      - 'cli-tool/src/claude-api-proxy.js'
      - 'cli-tool/tests/security/conversation-paths.test.cjs'
      - 'cli-tool/src/sandbox-server.js'
      - 'cli-tool/src/session-sharing.js'
      - 'cli-tool/tests/security/session-transfer.test.cjs'
      - 'cli-tool/src/sandbox-limits.js'
      - 'cli-tool/tests/security/sandbox-limits.test.cjs'
      - 'cli-tool/tests/security/sandbox-process-groups.test.cjs'
      - 'cli-tool/tests/security/sandbox-execution.test.cjs'
      - 'cli-tool/tests/security/console-bridge.test.cjs'
      - 'cli-tool/components/skills/productivity/notebooklm/scripts/**'
      - 'cli-tool/tests/security/notebooklm_urls_test.py'
      - 'scripts/dev-server.js'
      - 'scripts/dev-server.test.cjs'
      - '.github/workflows/console-bridge-security.yml'
  push:
    branches: [main]
    paths:
      - 'cli-tool/src/command-stats.js'
      - 'cli-tool/src/tracking-service.js'
      - 'docs/js/event-tracker.js'
      - 'cli-tool/tests/security/tracking-identifiers.test.cjs'
      - 'cli-tool/src/file-operations.js'
      - 'cli-tool/tests/security/write-permission-probe.test.cjs'
      - 'cli-tool/tests/security/cli-prompt-arguments.test.cjs'
      - 'cli-tool/src/skill-dashboard.js'
      - 'cli-tool/tests/security/skill-file-containment.test.cjs'
      - 'cli-tool/src/console-bridge.js'
      - 'cli-tool/src/validation/validators/ReferenceValidator.js'
      - 'cli-tool/tests/security/reference-url-accounting.test.cjs'
      - 'cli-tool/src/analytics/core/StateCalculator.js'
      - 'cli-tool/tests/security/state-calculator-inputs.test.cjs'
      - 'cli-tool/src/claude-api-proxy.js'
      - 'cli-tool/tests/security/conversation-paths.test.cjs'
      - 'cli-tool/src/sandbox-server.js'
      - 'cli-tool/src/session-sharing.js'
      - 'cli-tool/tests/security/session-transfer.test.cjs'
      - 'cli-tool/src/sandbox-limits.js'
      - 'cli-tool/tests/security/sandbox-limits.test.cjs'
      - 'cli-tool/tests/security/sandbox-process-groups.test.cjs'
      - 'cli-tool/tests/security/sandbox-execution.test.cjs'
      - 'cli-tool/tests/security/console-bridge.test.cjs'
      - 'cli-tool/components/skills/productivity/notebooklm/scripts/**'
      - 'cli-tool/tests/security/notebooklm_urls_test.py'
      - 'scripts/dev-server.js'
      - 'scripts/dev-server.test.cjs'
      - '.github/workflows/console-bridge-security.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli-tool/package-lock.json
      - run: npm ci
        working-directory: cli-tool
      - run: node --test tests/security/*.test.cjs
        working-directory: cli-tool
  development-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/dev-server.test.cjs
  notebooklm-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s cli-tool/tests/security -p notebooklm_urls_test.py
